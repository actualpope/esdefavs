[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-sync"
version = "1.4.0"
description = "Add games from the EmuDeck ROM folder to Steam through Steam ROM Manager"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SRM Sync contributors"}]
dependencies = []

[project.scripts]
srm-sync = "srm_sync.cli:main"

[tool.setuptools]
packages = ["srm_sync"]
