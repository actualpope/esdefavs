[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emudeck-favorites-sync"
version = "1.3.0"
description = "Add games from the EmuDeck ROM folder to Steam through Steam ROM Manager"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EmuDeck Favorites Sync contributors"}]
dependencies = []

[project.scripts]
emudeck-favorites-sync = "emudeck_favorites_sync.cli:main"

[tool.setuptools]
packages = ["emudeck_favorites_sync"]
